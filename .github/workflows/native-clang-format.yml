name: <Native> Apply clang format

#on: [push, pull_request]
on:
  pull_request_target:
    types: [closed]
    paths:
    - 'templates/**'
    - 'native/**'

jobs:
  Clang-Format:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        ref: ${{ github.head_sha }}
        fetch-depth: 0
    
    - id: get_change_files
      uses: fish9167/file-changes-action@v1.2.3
      with:
        output: ' '
        fileOutput: ' '

    - uses: DoozyX/clang-format-lint-action@v0.18
      with:
        source: ./native
        exclude: ./native/cocos/bindings/auto ./native/cocos/base/std ./native/cocos/editor-support/spine-wasm ./native/cocos/editor-support/spine ./native/cocos/gi/light-probe/predicates.cpp ./native/cocos/gi/light-probe/tetgen.cpp ./native/cocos/gi/light-probe/tetgen.h ./native/cocos/platform/openharmony/napi ./native/tools ./native/vendor ./native/cocos/cocos-version.h
        extensions: 'c,h,hpp,cpp,cxx'
        style: file
        inplace: true
        clangFormatVersion: 12

    - name: Create Pull Request 
      uses: fish9167/create-pull-request@v3
      with:
          title: '[ci skip][AUTO]: Automated PR to fix formatting'
          body: |
            Automated PR to fix formatting
          committer: cocos-robot <cocos-robot@cocos.com>
          author: cocos-robot <cocos-robot@cocos.com>
          commit-message: "[ci skip][AUTO]: Automated clang-format update: ${{ github.event.pull_request.head.sha }}  (#${{ github.event.number }})"
          token: ${{ secrets.PR_TOKEN }}
          push-to-fork: cocos-robot/cocos4
          branch: t/bot/fix-format
          branch-suffix: short-commit-hash
          delete-branch: true
